<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // i18n bootstrap：避免英文模式下的中文闪烁(FOUC)
    // 必须在 CSS 加载前执行，提前给 <html> 加 .i18n-pending 类
    (function() {
      try {
        var lang = localStorage.getItem('aix_lang');
        if (!lang) {
          var nav = (navigator.language || navigator.userLanguage || '').toLowerCase();
          if (nav.indexOf('zh') === 0) lang = 'zh-CN';
          else if (nav.indexOf('en') === 0) lang = 'en';
          else lang = 'zh-CN';
        }
        if (lang === 'en') {
          document.documentElement.classList.add('i18n-pending');
        }
      } catch (e) {}
    })();
  </script>
  <title>AIX未来视野 - AI 模型库</title>
  <link rel="icon" href="assets/AIX.jpg" type="image/jpeg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/models.css">
</head>
<body>
  <nav class="top-nav">
    <div class="nav-inner">
      <a href="/" class="logo-link">
        <img src="assets/AIX.jpg" alt="AIX Logo" class="logo-img">
        <span data-i18n="site.name">AIX未来视野</span>
      </a>
      <div class="nav-links">
        <a href="embodied.html" class="nav-link" data-i18n="nav.embodied">具身智能专区</a>
        <div class="nav-dropdown">
          <a href="/" class="nav-link nav-link-with-arrow active">
            <span data-i18n="nav.zone_llm">大模型专区</span>
            <span class="material-symbols-outlined nav-arrow">expand_more</span>
          </a>
          <div class="nav-dropdown-menu">
            <a href="models.html" class="nav-dropdown-link">
              <span class="material-symbols-outlined">inventory_2</span>
              <span data-i18n="nav.models">模型库</span>
            </a>
            <a href="calculator.html" class="nav-dropdown-link">
              <span class="material-symbols-outlined">calculate</span>
              <span data-i18n="nav.calculator">成本计算</span>
            </a>
          </div>
        </div>
      </div>
      <div class="nav-actions">
        <div class="lang-switcher">
          <button class="lang-current">
            <span class="material-symbols-outlined">language</span>
            <span class="lang-current-code">中</span>
            <span class="material-symbols-outlined lang-arrow">expand_more</span>
          </button>
          <div class="lang-menu">
            <a href="#" class="lang-option" data-lang="zh-CN">中文</a>
            <a href="#" class="lang-option" data-lang="en">English</a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <main class="main-content models-main">
    <header class="page-header models-header">
      <h1 class="page-title" data-i18n-html="models.page_title_full">AI <span class="text-gradient">模型库</span></h1>
      <p class="page-subtitle" data-i18n="models.page_subtitle">探索、比较和集成全球顶尖的人工智能模型。</p>
    </header>

    <div class="content-layout">
      <aside class="sidebar models-sidebar">
        <div class="sidebar-card">
          <h3 class="sidebar-title">
            <span class="material-symbols-outlined sidebar-icon">filter_list</span>
            <span data-i18n="models.sidebar_title">筛选条件</span>
          </h3>

          <div class="filter-section">
            <h4 class="filter-label" data-i18n="models.filter_provider">供应商</h4>
            <div class="checkbox-list" id="providerFilters">
              <label class="checkbox-item">
                <input type="checkbox" value="OpenAI" class="filter-checkbox">
                <span class="checkbox-label">OpenAI</span>
              </label>
              <label class="checkbox-item">
                <input type="checkbox" value="Anthropic" class="filter-checkbox">
                <span class="checkbox-label">Anthropic</span>
              </label>
              <label class="checkbox-item">
                <input type="checkbox" value="Google DeepMind" class="filter-checkbox">
                <span class="checkbox-label">Google DeepMind</span>
              </label>
              <label class="checkbox-item">
                <input type="checkbox" value="Meta" class="filter-checkbox">
                <span class="checkbox-label">Meta</span>
              </label>
              <label class="checkbox-item">
                <input type="checkbox" value="阿里巴巴" class="filter-checkbox">
                <span class="checkbox-label">阿里巴巴</span>
              </label>
              <label class="checkbox-item">
                <input type="checkbox" value="月之暗面" class="filter-checkbox">
                <span class="checkbox-label">月之暗面</span>
              </label>
              <label class="checkbox-item">
                <input type="checkbox" value="深度求索" class="filter-checkbox">
                <span class="checkbox-label">深度求索</span>
              </label>
              <label class="checkbox-item">
                <input type="checkbox" value="智谱AI" class="filter-checkbox">
                <span class="checkbox-label">智谱AI</span>
              </label>
              <label class="checkbox-item">
                <input type="checkbox" value="Mistral AI" class="filter-checkbox">
                <span class="checkbox-label">Mistral AI</span>
              </label>
              <label class="checkbox-item">
                <input type="checkbox" value="Stability AI" class="filter-checkbox">
                <span class="checkbox-label">Stability AI</span>
              </label>
            </div>
          </div>

          <div class="filter-section">
            <h4 class="filter-label" data-i18n="models.filter_type">模型类型</h4>
            <div class="tag-filters" id="typeFilters">
              <button class="tag-btn" data-type="大语言模型" data-i18n="models.type_llm">大语言模型</button>
              <button class="tag-btn" data-type="多模态" data-i18n="models.type_multimodal">多模态</button>
              <button class="tag-btn" data-type="视觉" data-i18n="models.type_vision">视觉</button>
              <button class="tag-btn" data-type="音频" data-i18n="models.type_audio">音频</button>
            </div>
          </div>

          <div class="filter-section">
            <h4 class="filter-label" data-i18n="models.filter_access">访问权限</h4>
            <div class="radio-list">
              <label class="radio-item">
                <input type="radio" name="access" value="all" checked class="filter-radio">
                <span class="radio-label" data-i18n="models.access_all">全部</span>
              </label>
              <label class="radio-item">
                <input type="radio" name="access" value="开源" class="filter-radio">
                <span class="radio-label" data-i18n="models.access_open">开源模型</span>
              </label>
              <label class="radio-item">
                <input type="radio" name="access" value="闭源" class="filter-radio">
                <span class="radio-label" data-i18n="models.access_closed">闭源/API</span>
              </label>
            </div>
          </div>
        </div>
      </aside>

      <section class="leaderboard-section models-section">
        <div class="models-top-bar">
          <div class="models-header-text">
            <h2 class="models-subtitle" data-i18n="models.subtitle">AI 模型库</h2>
            <span class="result-count" id="resultCount"></span>
          </div>
          <div class="search-box models-search">
            <span class="material-symbols-outlined search-icon">search</span>
            <input type="text" id="modelSearchInput" class="search-input" placeholder="搜索模型名称、供应商或标签..." data-i18n-attr="placeholder:models.search_placeholder">
            <button id="clearModelSearch" class="clear-btn" style="display:none;" aria-label="清除搜索">
              <span class="material-symbols-outlined">close</span>
            </button>
          </div>
        </div>

        <div class="models-grid-container">
          <div id="modelsLoading" class="loading-state">
            <div class="loading-spinner"></div>
            <p data-i18n="models.loading">加载数据中...</p>
          </div>
          <div id="modelsEmpty" class="empty-state" style="display:none;">
            <span class="material-symbols-outlined empty-icon">search_off</span>
            <p data-i18n="models.empty">未找到匹配的模型</p>
          </div>
          <div id="modelsGrid" class="models-grid" style="display:none;"></div>
        </div>

        <div id="modelsPagination" class="pagination" style="display:none;"></div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <p data-i18n="site.footer_rights">© 2026 AIX未来视野. 保留所有权利。</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/models.js"></script>
</body>
</html>
